{% extends "base.html" %}

{% block title %}Register | LiveStocks{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="container">
    <div class="auth-card row g-0">
      <div class="col-lg-6 auth-visual d-none d-lg-block">
        <div class="auth-image-wrap">
          <img src="https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=900&q=80" alt="Livestock farm" />
        </div>
      </div>
      <div class="col-lg-6 auth-form-wrap">
        <div class="auth-form-box">
          <p class="eyebrow text-primary">New investor</p>
          <h2>Create an account</h2>
          {% if error %}
            <div class="alert alert-danger mt-3">{{ error }}</div>
          {% endif %}
          <form method="post" action="/register">
            <div class="mb-3">
              <label for="full_name" class="form-label">Full name</label>
              <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required />
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
          </form>
          <p class="mt-4 mb-0 text-center small text-secondary">
            Already have an account?
            <a href="/login">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
